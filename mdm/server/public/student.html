<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0459aa">
  <title>우리반 수업</title>
  <link rel="icon" href="/brand/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="student">
  <!-- 들어오기 -->
  <main id="join" class="join" hidden>
    <div class="join-card">
      <img src="/brand/mark.svg" alt="" width="56" height="56">
      <h1>우리반 수업</h1>
      <div id="stepCode">
        <p>선생님이 알려 준 <b>방 코드 4자리</b>를 눌러요</p>
        <div class="code-boxes" id="codeBoxes" aria-live="polite"><span></span><span></span><span></span><span></span></div>
        <div class="keypad" id="keypad"></div>
      </div>
      <div id="stepSeat" hidden>
        <p id="seatLead"></p>
        <div class="seat-grid" id="seatGrid"></div>
        <p class="hint">흐린 번호는 이미 누가 들어와 있어요. 내 번호가 흐리면 선생님께 말씀드려요.</p>
        <div class="sheet-f" style="justify-content:center">
          <button class="btn" id="seatBack" type="button">방 코드 다시 넣기</button>
          <button class="btn primary big" id="seatGo" type="button" disabled>네, 들어갈래요</button>
        </div>
      </div>
      <p id="joinMsg" class="msg" role="alert"></p>
    </div>
  </main>

  <!-- 수업 -->
  <div id="sapp" class="s-app" hidden>
    <header class="s-top">
      <span class="s-seat" id="sSeat"></span>
      <div class="who"><b id="sTitle"></b><small id="sClass"></small></div>
      <i id="sConn" class="dot" title="연결 상태"></i>
      <span class="spacer"></span>
      <button id="exBtn" class="pill" hidden><svg class="i" aria-hidden="true"><use href="/icons.svg#search"/></svg>찾아보기</button>
      <button id="bellBtn" class="pill" hidden><svg class="i" aria-hidden="true"><use href="/icons.svg#bell"/></svg>알림 켜기</button>
    </header>
    <main class="s-main" id="sMain"></main>
    <footer class="s-bottom" id="sBottom"></footer>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/js/student.js" type="module"></script>
</body>
</html>
